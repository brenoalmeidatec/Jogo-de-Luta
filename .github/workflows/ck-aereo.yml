name: Saltos, pousos e golpes aéreos do CK
on:
  push:
    branches: [codex/ck-aereo]
    paths: ['chars/ck/**', 'ferramentas/**', 'sprites/ck/pecas/**', '.github/workflows/ck-aereo.yml']
permissions:
  contents: read
jobs:
  contato:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lote:
          - {nome: saltos, estados: 'neutro frente tras'}
          - {nome: socos, estados: '600 601'}
          - {nome: chutes, estados: '610 611 650'}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            chars/ck
            chars/hazaki
            ferramentas/robo
            motif/nazafight
      - uses: actions/checkout@v4
        with:
          ref: b7d1b83f4c2b97c3138b73951e04049a2bc689c7
          path: antes
          sparse-checkout: |
            chars/ck
            chars/hazaki
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool libgl1-mesa-dri libopenal1 libglfw3 libasound2 libdecor-0-0
          python3 -m pip install 'numpy<2' pillow opencv-python-headless==4.10.0.84
      - name: Saltar, conectar e pousar
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 ferramentas/filmar_aereo_ck.py antes/chars chars gifs ${{ matrix.lote.estados }}
      - name: Conferir o revés em pé no motor
        if: matrix.lote.nome == 'socos'
        run: xvfb-run -a python3 ferramentas/filmar_ataques_pe_ck.py antes/chars chars gifs 201
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ck-${{ matrix.lote.nome }}
          path: gifs/
      - name: Robô de combate
        if: matrix.lote.nome == 'chutes'
        run: |
          set -o pipefail
          python3 ferramentas/testar_pengaro.py --linux --lutador ck | tee robo.txt
          grep -E 'RESUMO: [1-9][0-9]+ verificações passaram, 0 falharam' robo.txt
