name: Anatomia e leitura de combate do elenco
on:
  push:
    branches: [codex/elenco-arte-audio]
    paths: ['chars/**', 'ferramentas/**', 'sprites/*/aereo/**', '.github/workflows/elenco-aereo-audio.yml']
permissions:
  contents: read
jobs:
  luta:
    runs-on: ubuntu-22.04
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        nome: [gbzin, ck, gutto, hazaki, pengaro, raiclaven]
        forma: [base, endiabrado]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            chars/${{ matrix.nome }}
            chars/hazaki
            chars/gbzin
            ferramentas/robo
            motif/nazafight
      - uses: actions/checkout@v4
        with:
          ref: a04373fefa8d4e070e96436e631ac3af23f5a4a2
          path: antes
          sparse-checkout: |
            chars/${{ matrix.nome }}
            chars/hazaki
            chars/gbzin
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth xdotool libgl1-mesa-dri libopenal1 libglfw3 libasound2 libdecor-0-0
          python3 -m pip install 'numpy<2' pillow opencv-python-headless==4.10.0.84
      - name: Filmar os cinco golpes, a defesa e o golpe no vazio
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 ferramentas/filmar_elenco.py ${{ matrix.nome }} ${{ matrix.forma }} antes/chars chars filmes soco chute afastar cotovelo duplo vazio guarda
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filme-${{ matrix.nome }}-${{ matrix.forma }}
          path: filmes/
      - name: Conferir o repertório de combate
        if: matrix.forma == 'base'
        run: |
          set -o pipefail
          python3 ferramentas/testar_pengaro.py --linux --lutador ${{ matrix.nome }} | tee resultado.txt
          grep -E 'RESUMO: [1-9][0-9]+ verificações passaram, 0 falharam' resultado.txt
