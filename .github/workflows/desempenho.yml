name: Desempenho da luta
on:
  workflow_dispatch:
  push:
    branches: [codex/desempenho-auto]
permissions:
  contents: read
jobs:
  medir:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            chars/ck
            chars/hazaki
            ferramentas
            motif/nazafight
            stages/maria_fumaca.def
            stages/maria_fumaca.sff
            stages/musicas/maria_fumaca.ogg
          sparse-checkout-cone-mode: false
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1 libglfw3 libasound2 libdecor-0-0
      - run: xvfb-run -a -s '-screen 0 1280x720x24' python3 ferramentas/medir_desempenho.py resultados normal leve leve normal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fps-ck-hazak
          path: resultados/
